# T-Pot: CUSTOM EDITION
# Generated on: 2026-07-30 13:02:20
networks:
  conpot_local_IEC104: null
  conpot_local_guardian_ast: null
  conpot_local_ipmi: null
  conpot_local_kamstrup_382: null
  nginx_local: null
  ewsposter_local: null
services:
  tpotinit:
    container_name: tpotinit
    env_file:
    - .env
    restart: always
    stop_grace_period: 60s
    tmpfs:
    - /tmp/etc:uid=2000,gid=2000
    - /tmp/:uid=2000,gid=2000
    network_mode: host
    cap_add:
    - NET_ADMIN
    image: ${TPOT_REPO}/tpotinit:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
    - ${TPOT_DOCKER_COMPOSE}:/tmp/tpot/docker-compose.yml:ro
    - ${TPOT_DATA_PATH}/blackhole:/etc/blackhole
    - ${TPOT_DATA_PATH}:/data
    - /var/run/docker.sock:/var/run/docker.sock:ro
  logstash:
    container_name: logstash
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
    - nginx_local
    environment:
    - LS_JAVA_OPTS=-Xms1024m -Xmx1024m
    - TPOT_TYPE=${TPOT_TYPE:-HIVE}
    - TPOT_HIVE_USER=${TPOT_HIVE_USER}
    - TPOT_HIVE_IP=${TPOT_HIVE_IP}
    - LS_SSL_VERIFICATION=${LS_SSL_VERIFICATION:-full}
    ports:
    - 127.0.0.1:64305:64305
    mem_limit: 2g
    image: ${TPOT_REPO}/logstash:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
    - ${TPOT_DATA_PATH}:/data
  conpot_IEC104:
    container_name: conpot_iec104
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    environment:
    - CONPOT_CONFIG=/etc/conpot/conpot.cfg
    - CONPOT_JSON_LOG=/var/log/conpot/conpot_IEC104.json
    - CONPOT_LOG=/var/log/conpot/conpot_IEC104.log
    - CONPOT_TEMPLATE=IEC104
    - CONPOT_TMP=/tmp/conpot
    tmpfs:
    - /tmp/conpot:uid=2000,gid=2000
    networks:
    - conpot_local_IEC104
    ports:
    - 161:161/udp
    - 2404:2404
    image: ${TPOT_REPO}/conpot:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
    - ${TPOT_DATA_PATH}/conpot/log:/var/log/conpot
  conpot_guardian_ast:
    container_name: conpot_guardian_ast
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    environment:
    - CONPOT_CONFIG=/etc/conpot/conpot.cfg
    - CONPOT_JSON_LOG=/var/log/conpot/conpot_guardian_ast.json
    - CONPOT_LOG=/var/log/conpot/conpot_guardian_ast.log
    - CONPOT_TEMPLATE=guardian_ast
    - CONPOT_TMP=/tmp/conpot
    tmpfs:
    - /tmp/conpot:uid=2000,gid=2000
    networks:
    - conpot_local_guardian_ast
    ports:
    - 10001:10001
    image: ${TPOT_REPO}/conpot:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
    - ${TPOT_DATA_PATH}/conpot/log:/var/log/conpot
  conpot_ipmi:
    container_name: conpot_ipmi
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    environment:
    - CONPOT_CONFIG=/etc/conpot/conpot.cfg
    - CONPOT_JSON_LOG=/var/log/conpot/conpot_ipmi.json
    - CONPOT_LOG=/var/log/conpot/conpot_ipmi.log
    - CONPOT_TEMPLATE=ipmi
    - CONPOT_TMP=/tmp/conpot
    tmpfs:
    - /tmp/conpot:uid=2000,gid=2000
    networks:
    - conpot_local_ipmi
    ports:
    - 623:623/udp
    image: ${TPOT_REPO}/conpot:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
    - ${TPOT_DATA_PATH}/conpot/log:/var/log/conpot
  conpot_kamstrup_382:
    container_name: conpot_kamstrup_382
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    environment:
    - CONPOT_CONFIG=/etc/conpot/conpot.cfg
    - CONPOT_JSON_LOG=/var/log/conpot/conpot_kamstrup_382.json
    - CONPOT_LOG=/var/log/conpot/conpot_kamstrup_382.log
    - CONPOT_TEMPLATE=kamstrup_382
    - CONPOT_TMP=/tmp/conpot
    tmpfs:
    - /tmp/conpot:uid=2000,gid=2000
    networks:
    - conpot_local_kamstrup_382
    ports:
    - 1025:1025
    - 50100:50100
    image: ${TPOT_REPO}/conpot:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
    - ${TPOT_DATA_PATH}/conpot/log:/var/log/conpot
  suricata:
    container_name: suricata
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    environment:
    - OINKCODE=${OINKCODE:-OPEN}
    network_mode: host
    cap_add:
    - NET_ADMIN
    - SYS_NICE
    - NET_RAW
    image: ${TPOT_REPO}/suricata:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
    - ${TPOT_DATA_PATH}/suricata/log:/var/log/suricata
  elasticsearch:
    container_name: elasticsearch
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
    - nginx_local
    environment:
    - bootstrap.memory_lock=true
    - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
    - ES_TMPDIR=/tmp
    cap_add:
    - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 4g
    ports:
    - 127.0.0.1:64298:9200
    image: ${TPOT_REPO}/elasticsearch:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
    - ${TPOT_DATA_PATH}:/data
  kibana:
    container_name: kibana
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
    - nginx_local
    mem_limit: 1g
    ports:
    - 127.0.0.1:64296:5601
    image: ${TPOT_REPO}/kibana:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
  map_redis:
    container_name: map_redis
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
    - nginx_local
    stop_signal: SIGKILL
    tty: true
    image: ${TPOT_REPO}/redis:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
  map_web:
    container_name: map_web
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
    - nginx_local
    environment:
    - MAP_COMMAND=AttackMapServer.py
    stop_signal: SIGKILL
    tty: true
    ports:
    - 127.0.0.1:64299:64299
    image: ${TPOT_REPO}/map:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
  map_data:
    container_name: map_data
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
    - nginx_local
    environment:
    - MAP_COMMAND=DataServer_v2.py
    - TPOT_ATTACKMAP_TEXT=${TPOT_ATTACKMAP_TEXT}
    - TZ=${TPOT_ATTACKMAP_TEXT_TIMEZONE}
    stop_signal: SIGKILL
    tty: true
    image: ${TPOT_REPO}/map:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
  ewsposter:
    container_name: ewsposter
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
    - ewsposter_local
    environment:
    - EWS_HPFEEDS_ENABLE=false
    - EWS_HPFEEDS_HOST=host
    - EWS_HPFEEDS_PORT=port
    - EWS_HPFEEDS_CHANNELS=channels
    - EWS_HPFEEDS_IDENT=user
    - EWS_HPFEEDS_SECRET=secret
    - EWS_HPFEEDS_TLSCERT=false
    - EWS_HPFEEDS_FORMAT=json
    image: ${TPOT_REPO}/ewsposter:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
    - ${TPOT_DATA_PATH}:/data
    - ${TPOT_DATA_PATH}/ews/conf/ews.ip:/opt/ewsposter/ews.ip
  nginx:
    container_name: nginx
    restart: always
    environment:
    - TPOT_OSTYPE=${TPOT_OSTYPE}
    depends_on:
      tpotinit:
        condition: service_healthy
    tmpfs:
    - /var/tmp/nginx/client_body
    - /var/tmp/nginx/proxy
    - /var/tmp/nginx/fastcgi
    - /var/tmp/nginx/uwsgi
    - /var/tmp/nginx/scgi
    - /run
    - /var/lib/nginx/tmp:uid=100,gid=82
    networks:
    - nginx_local
    ports:
    - 64297:64297
    - 64294:64294
    image: ${TPOT_REPO}/nginx:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
    - ${TPOT_DATA_PATH}/nginx/cert/:/etc/nginx/cert/:ro
    - ${TPOT_DATA_PATH}/nginx/conf/nginxpasswd:/etc/nginx/nginxpasswd:ro
    - ${TPOT_DATA_PATH}/nginx/conf/lswebpasswd:/etc/nginx/lswebpasswd:ro
    - ${TPOT_DATA_PATH}/nginx/log/:/var/log/nginx/
  spiderfoot:
    container_name: spiderfoot
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
    - nginx_local
    ports:
    - 127.0.0.1:64303:8080
    image: ${TPOT_REPO}/spiderfoot:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
    - ${TPOT_DATA_PATH}/spiderfoot:/home/spiderfoot/.spiderfoot
